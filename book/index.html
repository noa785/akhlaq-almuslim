<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2C4B3">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رحلة لغتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>رحلة لغتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone-first game. Home = winding lesson path; lesson = full screen card flow. Palette from the unit 3 book header (peach, teal, orange, blue). Single bright look by choice. */
:root{
  --bg:#FFF7F2; --card:#FFFFFF; --ink:#24343A; --mut:#6B7C80;
  --peach:#F2C4B3; --peach2:#FBE6DD; --teal:#25A8AE; --teal2:#E0F4F4; --tealD:#14787D;
  --orange:#F26A2E; --orange2:#FFE4D6; --blue:#1767B0; --blue2:#E2EEFA;
  --good:#2BA84A; --good2:#E3F6E7; --bad:#E0473C; --bad2:#FDE7E5; --gold:#F5B700; --line:#EBD9D0;
  --f-disp:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-ui:"Tajawal",system-ui,sans-serif;
  --f-read:"Noto Naskh Arabic","Tajawal",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;direction:rtl;margin:0;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0 10px}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}
.hero{background:linear-gradient(135deg,var(--peach) 0%,var(--peach2) 100%);border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-30px;top:-30px;width:150px;height:150px;background:conic-gradient(from 200deg,var(--teal) 0 18%,var(--blue) 18% 30%,var(--orange) 30% 44%,transparent 44%);opacity:.9;transform:rotate(-12deg);border-radius:20px}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:30px;margin:0;line-height:1.2;position:relative;z-index:1;text-wrap:balance}
.hero p{margin:6px 0 0;color:#5a3b30;font-weight:700;position:relative;z-index:1}
.lvl{margin-top:12px;position:relative;z-index:1}
.lvl .bar{height:12px;background:#fff;border-radius:99px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .6s}
.lvl small{display:flex;justify-content:space-between;font-weight:700;margin-top:4px;color:#5a3b30}
/* path */
.path{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sect{font-family:var(--f-disp);font-weight:800;font-size:20px;margin:14px 0 2px;color:var(--tealD)}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px 14px;cursor:pointer;text-align:right;width:100%;transition:transform .12s}
.node:active{transform:translateY(3px);border-bottom-width:2px}
.node:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.node .ic{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:22px;color:#fff;background:var(--teal);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.node.read .ic{background:var(--blue)} .node.word .ic{background:var(--orange)} .node.dict .ic{background:#8B5CC7} .node.boss .ic{background:var(--gold);color:#5a3b00}
.node .tx{flex:1;min-width:0}
.node b{display:block;font-size:17.5px}
.node span{color:var(--mut);font-size:14px}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:18px;height:18px}
.node.done{border-color:#bfe6c8;background:#F6FFF8}
.parent{margin-top:22px;background:var(--teal2);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.7}
.parent b{color:var(--tealD)}
/* lesson screen */
.lhead{display:flex;align-items:center;gap:10px;padding:8px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--mut);padding:4px 6px}
.prog{flex:1;height:16px;background:#F0E2DA;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .4s}
.combo{font-weight:800;color:var(--orange);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tag{display:inline-block;font-weight:800;font-size:13px;border-radius:99px;padding:2px 10px;background:var(--teal2);color:var(--tealD);margin-bottom:8px}
.tag.hots{background:#EFE6FA;color:#6A3EA8}
.q{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.45;margin:0 0 14px;text-wrap:balance}
.learn h2{font-family:var(--f-disp);font-size:24px;margin:0 0 8px;color:var(--tealD)}
.learn p,.learn li{line-height:1.85;font-size:17.5px}
.learn ul{padding-inline-start:20px;margin:6px 0}
.ex{background:var(--orange2);border-radius:14px;padding:8px 12px;margin:8px 0;font-family:var(--f-read);font-size:19px;line-height:1.9}
.tip{background:var(--blue2);border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:700;color:#0f4c86}
.story{font-family:var(--f-read);font-size:21px;line-height:2.15}
.story p{margin:0 0 10px}
.gl{background:linear-gradient(transparent 60%,#FFD9C7 60%);cursor:pointer;border-radius:4px}
.ayah{color:#1E7A3C;font-weight:700}
.meaning{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:17px;margin-top:10px}
.meaning[hidden]{display:none!important}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;font-size:18.5px;font-weight:700;cursor:pointer;font-family:var(--f-read)}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt.ok{border-color:var(--good);background:var(--good2)}
.opt.no{border-color:var(--bad);background:var(--bad2)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{text-align:center;font-family:var(--f-ui);font-size:20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols>div{display:grid;gap:8px;align-content:start;min-width:0}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px;font-size:17.5px;font-weight:700;cursor:pointer;text-align:center;font-family:var(--f-read);min-height:52px}
.tile.sel{border-color:var(--blue);background:var(--blue2)}
.tile.gone{opacity:.25;pointer-events:none;border-color:var(--good);background:var(--good2)}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;min-height:56px}
.bins{display:grid;gap:10px}
.bin{border:2px dashed var(--teal);border-radius:16px;padding:8px;min-height:64px;background:var(--teal2);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:16px;color:var(--tealD)}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{background:#fff;border-radius:10px;padding:2px 10px;font-family:var(--f-read);font-weight:700}
.line{min-height:62px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:14px}
.foot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.fb{border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:17px;line-height:1.7;animation:pop .2s}
.fb.ok{background:var(--good2);color:#17602a}
.fb.no{background:var(--bad2);color:#8d221b}
.fb b{font-family:var(--f-disp);font-size:20px;display:block}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:19px;font-weight:800;cursor:pointer;color:#fff;background:var(--teal);box-shadow:0 5px 0 var(--tealD)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tealD)}
.btn[disabled]{background:#D8CFCB;box-shadow:0 5px 0 #bfb5b0;cursor:default}
.btn.go{background:var(--good);box-shadow:0 5px 0 #1d7a35}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #a8322a}
.btn.ghost{background:var(--card);color:var(--tealD);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.row{display:flex;gap:10px}
.dictbox{font-family:var(--f-read);font-size:21px;line-height:2.1;background:#FFFDF8;border:2px solid var(--line);border-radius:16px;padding:12px}
.dictbox.hide{filter:blur(9px);user-select:none}
.mk{display:inline-block;color:#fff;font-weight:800;border-radius:99px;padding:2px 12px;font-size:14px;background:var(--orange);margin-bottom:6px}
.mk.p{background:#8B5CC7}
/* result */
.res{text-align:center;padding-top:20px}
.res h2{font-family:var(--f-disp);font-size:34px;margin:10px 0 4px;color:var(--tealD)}
.bigstars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.bigstars svg{width:58px;height:58px;animation:pop .5s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.stat b{display:block;font-family:var(--f-disp);font-size:28px;color:var(--orange);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.mascot{width:96px;height:96px;margin:0 auto}
table.mini{width:100%;border-collapse:collapse;font-size:16px;margin:6px 0}
table.mini td,table.mini th{border:1.5px solid var(--line);padding:5px 8px;text-align:right}
table.mini th{background:var(--teal2);color:var(--tealD)}

.units{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ucard{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:right;min-width:0}
.ucard .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:17px;margin-bottom:4px}
.ucard b{display:block;font-size:16px;line-height:1.35}
.ucard small{color:var(--mut);font-weight:700;font-size:13px}
.ucard .ub{height:7px;background:#F0E2DA;border-radius:99px;overflow:hidden;margin-top:6px}
.ucard .ub i{display:block;height:100%;border-radius:99px}
.ucard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}

.hero p{max-width:75%}
.credit{text-align:center;color:var(--mut);font-size:13px;margin-top:18px;font-weight:700}
</style>

</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ================= الوحدة الأولى: التعامل مع الآخرين (ص 13 إلى 52) ================= */
const U1 = [
{id:"u1-start", kind:"word", sect:"البداية", title:"الأوصاف والاستماع والنشيد", pages:"ص 15 إلى 21",
learn:[
 {h:"أوصاف تعجبنا وأوصاف لا تعجبنا", b:`<p><b>أوصاف حسنة:</b> كريم، متعاون، مهذّب، صادق، رحيم، أمين.<br><b>أوصاف سيئة:</b> مبذّر، طمّاع، كذّاب، غشّاش، ظالم، بخيل.</p><p class="tip">قال ﷺ: «إنَّ من خيارِكم أحسنَكم أخلاقًا».</p>`},
 {h:"نص الاستماع: شكرًا يا جاري", b:`<ul><li>الشقيقان <b>طارق وزياد</b> يلعبان الكرة في <b>فناء منزلهما</b>، والشخصيات: طارق، زياد، الجار.</li><li><b>طارق</b> قرع الباب <b>بلطف</b>.</li><li><b>زياد</b> صاح بأعلى صوته: هيا، أعطوني الكرة بسرعة، ففتح الجار الباب <b>غاضبًا</b>.</li><li>قال زياد: <b>أعتذر عن خطئي يا عم، وأرجو أن تسامحني</b>، <b>فسامحه</b> الجار.</li></ul><p class="tip">التعامل الصحيح: التبسّم، وإلقاء السلام، والاعتراف بالخطأ. وغير الصحيح: الصراخ، وقرع الأبواب بقوة.</p>`},
 {h:"النشيد: آداب الحديث", b:`<div class="ex">أدّبني الإسلامُ الأعظمْ * منْ هَدْيِ رسولي أتعلّمْ<br>لا أرفعُ صوتًا في المجلسْ * لا ألمزُ أحدًا أو أهمسْ<br>لستُ أقاطعُ منْ يتكلّمْ<br>أُحسنُ حينَ أقولُ كلامَا * لا مغتابًا أو نمّامَا<br>وإذا ما خاطبني جاهلْ * وأطالَ لسانًا بالباطلْ<br>أصبرُ ثمّ أقولُ: سلامَا</div><table class="mini"><tr><th>الكلمة</th><th>معناها</th></tr><tr><td>هَدْي</td><td>أقوال وأفعال</td></tr><tr><td>ألمِز</td><td>أعيب وأنتقص</td></tr><tr><td>مغتابًا</td><td>ذاكرًا صفات الناس السيئة في غيابهم</td></tr><tr><td>نمّامًا</td><td>ناقلًا للكلام بين الناس بقصد الإفساد</td></tr></table>`}
],
ex:[
 {t:"sort", q:"صنّفي الأوصاف", bins:["أوصاف تعجبني","أوصاف لا تعجبني"], items:[["كريم",0],["مهذّب",0],["أمين",0],["صادق",0],["طمّاع",1],["كذّاب",1],["بخيل",1],["غشّاش",1]]},
 {t:"match", q:"صِلي الكلمة بمعناها", pairs:[["هَدْي","أقوال وأفعال"],["ألمِز","أعيب وأنتقص"],["مغتابًا","يذكر عيوب الناس في غيابهم"],["نمّامًا","ينقل الكلام بين الناس ليفسد"]]},
 {t:"mcq", q:"كان الشقيقان طارق وزياد يلعبان الكرة في:", o:["الشارع","فناء منزلهما"], a:1},
 {t:"mcq", q:"قرع طارق الباب:", o:["بقوة","بلطف"], a:1},
 {t:"mcq", q:"عاد زياد واعتذر للجار:", o:["فسامحه","فلم يسامحه"], a:0},
 {t:"sort", q:"تعامل صحيح أم غير صحيح؟", bins:["صحيح ✓","غير صحيح ✗"], items:[["التبسّم في وجوه الآخرين",0],["إلقاء السلام",0],["الاعتراف بالخطأ",0],["الصراخ في وجوه الآخرين",1],["قرع الأبواب بقوة",1]]},
 {t:"mcq", q:"اختاري أداة السؤال: (.......) خرج الجار غاضبًا؟", o:["كيف","لماذا"], a:1, why:"نسأل عن السبب بـ(لماذا)."},
 {t:"mcq", q:"اختاري أداة السؤال: (.......) تعامل طارق مع الجار ليستعيد الكرة؟", o:["كيف","لماذا"], a:0, why:"نسأل عن الطريقة والحال بـ(كيف)."},
 {t:"mcq", q:"في النشيد: إذا خاطبني جاهل وأطال لسانه:", o:["أصرخ عليه","أصبر ثم أقول: سلامًا","أبتعد وأبكي"], a:1},
 {t:"mcq", hots:1, q:"لماذا سامح الجار زيادًا في النهاية؟", o:["لأنه خاف منه","لأن زيادًا اعترف بخطئه واعتذر","لأن الكرة كانت لطارق","لأنه لم يسمعه"], a:1}
]},
{id:"u1-adel", kind:"read", sect:"الدرس الأول: عادل في الطائرة", title:"قصة عادل في الطائرة", pages:"ص 22، 23",
learn:[
 {h:"اقرئي القصة بصوت عالٍ", story:true, b:`
<p>دخلَ الوالدُ حاملًا في يدِه تذاكرَ السفرِ، فاستقبلتْهُ الأسرةُ بفرحٍ، وأسرعَ الجميعُ لتجهيزِ حقائبِهمُ الكبيرةِ استعدادًا للرحلةِ إلّا عادلًا، اكتفى بحقيبةٍ يدويّةٍ صغيرةٍ.</p>
<p>وقبلَ موعدِ الرحلةِ وصلتِ الأسرةُ إلى المطارِ، واستقرَّ أفرادُها على المقاعدِ في صالةِ الانتظارِ كغيرِهمْ منَ المسافرينَ، غيرَ امرأةٍ كانتْ تحملُ طفلًا لمْ تجدْ مكانًا تجلسُ فيه.</p>
<p>رآها عادلٌ فقامَ عنْ مقعدِه وأجلسَها، ووقفَ <span class="gl" data-m="يُطيل النظر">يتأمّلُ</span> المسافرينَ ويستمتعُ بحركتِهمْ حتّى سمعَ النداءَ لصعودِ الطائرةِ.</p>
<p>صعدَ عادلٌ إلى الطائرةِ بهدوءٍ، ووجدَ المضيفَ في استقبالِه <span class="gl" data-m="دلّه، وضدها: أضلّ">فأرشدَهُ</span> إلى المقعدِ المخصَّصِ لهُ، جلسَ عادلٌ على مقعدِه، وربطَ حزامَ الأمانِ استعدادًا <span class="gl" data-m="انطلاق الطائرة وارتفاعها، وضدها: هبوط">لإقلاعِ</span> الطائرةِ، وأثناءَ ذلكَ استمعَ إلى تعليماتِ السلامةِ، وردّدَ معَ قائدِ الطائرةِ دعاءَ السفرِ.</p>
<p>أخذَ عادلٌ يطالعُ مجلّةً للأطفالِ، وبينَما هوَ يقلّبُ صفحاتِ المجلّةِ سمعَ <span class="gl" data-m="صوتًا عاليًا مزعجًا، وضدها: هادئ">ضجيجًا</span>، فالتفتَ يمينًا وشمالًا فإذا أطفالٌ يركضونَ في ممرّاتِ الطائرةِ، ويعبثونَ بمحتوياتِها.</p>
<p><span class="gl" data-m="تعجّب">دهشَ</span> عادلٌ منْ تصرُّفِهمْ، وقالَ: الطائرةُ ليستْ مكانًا للّعبِ يا أبي!</p>
<p>ردَّ الأبُ: أحسنتَ يا عادلُ، فالطائرةُ وسيلةٌ للسفرِ، فهيَ تحملُ ركّابًا منْ أجناسٍ متنوّعةٍ وأديانٍ مختلفةٍ، ولا بُدَّ أنْ نريَهمْ صورةً <span class="gl" data-m="حسنة وجميلة">مشرِّفةً</span> للمسلمِ الذي يتحلّى بأخلاقِ الإسلامِ ويتمسّكُ بآدابِه، فقدْ قالَ الرسولُ ﷺ: «أكملُ المؤمنينَ إيمانًا أحسنُهمْ خلقًا».</p>`}
],

{id:"u1-year", kind:"read", sect:"الدرس الثاني: عام دراسي جديد", title:"قصة عام دراسي جديد", pages:"ص 34، 35",
learn:[
 {h:"اقرئي القصة بصوت عالٍ", story:true, b:`
<p>معَ بدايةِ العامِ الدراسيِّ الجديدِ، وبعدَ أنِ اكتملَ تلاميذُ الصفِّ الثالثِ الابتدائيِّ في فصلِهمْ؛ طلبَ المعلّمُ منهُمْ أنْ يعرّفوا بأنفسِهمْ؛ كيْ يعرفَ كلُّ واحدٍ زميلَهُ.</p>
<p>ثُمَّ قالَ لهمْ: ماذا يتمنّى كلُّ واحدٍ منكُمْ معَ بدايةِ العامِ الدراسيِّ؟</p>
<p>قالَ أحمدُ: أتمنّى أنْ أكونَ منَ المتفوّقينَ في مدرستي، وأنْ <span class="gl" data-m="أُفرِح، وضدها: أُحزن">أُسعدَ</span> والديَّ بتفوّقي.</p>
<p>المعلّمُ: لتكونَ متفوّقًا بينَ زملائكَ لا بُدَّ أنْ تقرأَ الدرسَ في اليومِ السابقِ؛ لتتابعَ شرحَ المعلّمِ <span class="gl" data-m="سهولة">بيُسرٍ</span>، وتوجِّهَ إليهِ الأسئلةَ التي تحتاجُ إلى إجاباتٍ عنها، وتراجعَ دروسَكَ دائمًا، عندَها ستكونُ <span class="gl" data-m="موضع اهتمام">محطَّ</span> أنظارِ زملائكَ وإعجابِهمْ، ويسعدُ بذلكَ والداكَ.</p>
<p>قالَ عادلٌ ضاحكًا: كنتُ أتمنّى أنْ أنامَ اليومَ؛ فأنا مازلتُ متعبًا.</p>
<p>المعلّمُ: منَ المشكلاتِ التي تواجهُ التلاميذَ الاستيقاظُ صباحًا للذهابِ إلى المدرسةِ، حيثُ يتمنَّوْنَ أنْ يناموا مدّةً أطولَ، وحلُّ هذهِ المشكلةِ سهلٌ للغايةِ؛ وهوَ أنْ تنامَ مساءً في وقتٍ مبكّرٍ؛ لتستيقظَ لصلاةِ الفجرِ، قبلَ موعدِ الدراسةِ بوقتٍ كافٍ.</p>
<p>قالَ فوّازٌ: أتمنّى أنْ <span class="gl" data-m="تكثر وتعمّ">تسودَ</span> روحُ المحبّةِ بيني وبينَ زملائي؛ لتصبحَ المدرسةُ عامرةً بالحبِّ والتعاونِ.</p>
<p>المعلّمُ: أحسنتَ يا فوّازُ، علينا أنْ نتجنّبَ <span class="gl" data-m="العداوات">المشاحناتِ</span> والخصامَ والخطأَ على الآخرينَ؛ لتسودَ المحبّةُ بينَ الجميعِ.</p>
<p>يا أبنائي، ما أجملَ حسنَ الخلقِ، واحترامَ الآخرينَ في المدرسةِ والشارعِ وفي كلِّ مكانٍ! قالَ الرسولُ ﷺ: «إنَّ منْ <span class="gl" data-m="أفاضلكم">خيارِكمْ</span> أحسنَكمْ أخلاقًا».</p>`}
],

learn:[{h:"نص نموذج الاختبار (1) من الكتاب", b:`<div class="ex">في صباحِ يومٍ ربيعيٍّ، كانتِ النحلتانِ جميلةُ وزينةُ تتنقّلانِ بينَ الزهورِ البيضاءِ والحمراءِ والصفراءِ؛ لجمعِ الرحيقِ منها لتصنعا منهُ العسلَ، وعندما اقتربتا منْ شجرةِ سِدْرٍ سمعتا صوتًا مخيفًا يقولُ: ما هذا الطنينُ المزعجُ؟ ابتعدتا قليلًا، فإذا نسرٌ كبيرٌ ينظرُ إليهما بحدّةٍ ويتوعّدُ: إيّاكما أنْ تعودا إلى هذهِ الشجرةِ، فهيَ لي، وأتربّصُ فيها بفرائسي؛ لأنقضَّ عليها بمخالبي.<br>عادتِ النحلتانِ إلى خليّتِهما خائفتيْنِ، وأخبرتا الملكةَ بما حدثَ، صمتتِ الملكةُ وأخذتْ تفكّرُ، وجمعتِ النحلَ؛ لمناقشةِ هذهِ القضيّةِ، وإيجادِ حلٍّ لها. رأى بعضُ النحلِ أنْ تأذنَ للجميعِ بتركِ الخليّةِ ومغادرةِ الغابةِ، وقُلْنَ: النسرُ قويٌّ، وحجمُنا صغيرٌ. أمّا الفريقُ الآخرُ فقدْ رفضَ، وقُلْنَ: نحنُ قويّاتٌ باتّحادِنا وتعاونِنا، والغابةُ مُلْكٌ للجميعِ. وبعدَ مناقشاتٍ طويلةٍ اتّفقْنَ على أنْ ينتظمْنَ في صفوفٍ متراصّةٍ، وينطلقْنَ نحوَ الغابةِ؛ لمواجهةِ النسرِ.</div>`}],

{id:"u2-riyadh", kind:"read", sect:"الدرس الأول: الرياض والملك الشجاع", title:"قصة الرياض والملك الشجاع", pages:"ص 62، 63",
learn:[
 {h:"اقرئي النص بصوت عالٍ", story:true, b:`
<p>زارتْ نورةُ مع أسرتِها مدينةَ الرياضِ، وفي الطريقِ قالتِ الأمُّ: سأحدّثُكم عن موحّدِ مملكتِنا الحبيبةِ المملكةِ العربيةِ السعوديةِ، وبطلِ الرياضِ الذي استردَّها، ووحّدَ البلادَ تحتَ رايةِ التوحيدِ، إنّه الملكُ عبدُالعزيزِ آلُ سعودٍ رحمه الله، الملكُ الشجاعُ والقائدُ الذكيُّ الذي كافحَ حتى استردَّ مُلكَ آبائِه وأجدادِه، وكانَ همُّه رفعةَ المملكةِ ونشرَ <span class="gl" data-m="سعة العيش">الرخاءِ</span> والأمنِ في ربوعِها. لقد كانَ فرحُ الناسِ عظيمًا عندما استردَّ الأميرُ الشابُّ الرياضَ، وسمعوا أحدَ رجالِ الملكِ يقولُ: الحكمُ للهِ، ثمّ لعبدِالعزيزِ بنِ عبدِالرحمنِ.</p>
<p>قالَ فوّازٌ: إنّه الملكُ العادلُ، الذي أحبَّ شعبَه وأحبّوه.</p>
<p>قالتْ نورةُ: أنا سعيدةٌ؛ لأنّني سأزورُ مدينةَ الملكِ الشجاعِ، ثمّ سألتْ نورةُ أباها: لماذا سُمّيتِ الرياضُ بهذا الاسمِ يا أبي؟</p>
<p>قالَ الأبُ: سُمّيتِ الرياضُ بهذا الاسمِ؛ لأنّها كانتْ رياضًا خضراءَ، كثيرةَ البساتينِ والحدائقِ <span class="gl" data-m="كثيرة الشجر والطيور">الغنّاءِ</span>، وسطَ الصحراءِ <span class="gl" data-m="التي لا ماء فيها">القاحلةِ</span>، وما زالتِ الرياضُ رياضًا خضراءَ بحدائقِها التي تنتشرُ في كلِّ مكانٍ.</p>
<p>والرياضُ عاصمةُ مملكتِنا الغاليةِ المملكةِ العربيةِ السعوديةِ، وأكبرُ مدنِها، ففيها مقرُّ الحكمِ والوزاراتُ والسفاراتُ، ويوجدُ فيها بناياتٌ <span class="gl" data-m="مرتفعة جدًّا، وضدها: منخفضة">شاهقةٌ</span>، أحياؤُها متعدّدةٌ وشوارعُها واسعةٌ، وفيها شبكةٌ من الجسورِ والأنفاقِ، وفي الرياضِ كثيرٌ من المعالمِ التاريخيّةِ، كحصنِ المصمكِ وآثارِ الدرعيّةِ التاريخيّةِ والمتحفِ الوطنيِّ، وجبلِ أبي غاربٍ، وهو المكانُ الذي حطَّ الملكُ عبدُالعزيزِ رحالَه فيه ليلةَ استردادِ الرياضِ، وقد أُقيمتْ عليه حديقةُ المُناخِ.</p>`}
],

]},

{id:"u2-masayef", kind:"read", sect:"الدرس الثاني: مصايفنا", title:"قصة مصايفنا", pages:"ص 72، 73",
learn:[
 {h:"اقرئي النص بصوت عالٍ", story:true, b:`
<p>طلبَ المعلّمُ من التلاميذِ التحدّثَ إلى زملائِهم عن المصايفِ الجبليّةِ في المملكةِ العربيّةِ السعوديّةِ.</p>
<p>بدأَ مهنّدٌ الحديثَ قائلًا: من المدنِ التي زرتُها وأعجبَتْني محافظةُ الطائفِ، إحدى أشهرِ المصايفِ السعوديّةِ وتُسمّى (عروسَ المصايفِ)، وهي <span class="gl" data-m="مكان يقصده الناس في الصيف">مصيفٌ</span> جبليٌّ يتميّزُ بكثرةِ المتنزّهاتِ والحدائقِ.</p>
<p>ومن أشهرِ المتنزّهاتِ في الطائفِ: الشَّفا والهَدى. كما يقصدُ السائحونَ <span class="gl" data-m="المواقع القديمة المشهورة">المعالمَ الأثريّةَ</span> مثلَ قصرِ شبرا وسدِّ وادي عكرمةَ. وتشتهرُ الطائفُ بزراعةِ العنبِ، والرمّانِ، والتوتِ، والتينِ الشوكيِّ (البرشوميّ).</p>
<p>كما تحدّثَ عن منطقةِ الباحةِ التي يرتادُها المصطافونَ؛ لجمالِ طبيعتِها، حيثُ تكثرُ فيها المدرّجاتُ الزراعيّةُ والغاباتُ ومن أشهرِها غابةُ رغدانَ، كما تضمُّ العديدَ من الأسواقِ والمواقعِ التاريخيّةِ والآثارِ كالقلاعِ والحصونِ القديمةِ والقرى الأثريّةِ كقريةِ (ذي عين).</p>
<p>ثمّ تحدّثَ حامدٌ عن منطقةِ عسيرَ التي فيها كثيرٌ من المصايفِ، من أهمّها مدينةُ أبها، وهي من أجملِ مصايفِ المملكةِ، وتُسمّى (عروسَ الجبلِ)، حيثُ ينعمُ السائحونَ فيها <span class="gl" data-m="الهواء اللطيف">بالنسيمِ العليلِ</span> والمناظرِ <span class="gl" data-m="الجميلة المحبّبة">الخلّابةِ</span> والخضرةِ الكثيفةِ، ومن أهمِّ المتنزّهاتِ السياحيّةِ فيها: متنزّهُ عسيرَ الوطنيُّ، ويتكوّنُ من عدّةِ مواقعَ، منها: السودةُ، ودلغانُ، والحبلةُ.</p>
<p>ومن المصايفِ الجميلةِ في بلادِنا، منطقةُ جازانَ التي تمتازُ بالتنوّعِ البيئيِّ والمناخيِّ، وتُعدُّ البوابةَ الرئيسةَ لجزرِ فرسانَ.</p>
<p>أيضًا مدينةُ نجرانَ وهي من أقدمِ المناطقِ التاريخيّةِ، حيثُ تشتهرُ جبالُها بالنقوشِ المتنوّعةِ وتوجدُ فيها الآثارُ كالأخدودِ.</p>
<p>ولأنَّ هذه المصايفَ ذاتُ طبيعةٍ جبليّةٍ، فقد أنشأَتِ الحكومةُ شبكةً من الطرقِ والجسورِ والأنفاقِ التي <span class="gl" data-m="تصل، وضدها: تفصل">تربطُها</span> بمناطقِ المملكةِ؛ لتسهيلِ التنقّلِ لأغراضِ التعليمِ والتجارةِ والسياحةِ.</p>`}
],

learn:[{h:"نص نموذج الاختبار (2) من الكتاب", b:`<div class="ex">الإسفنجُ كائنٌ حيٌّ يعيشُ في قاعِ المحيطاتِ، وليسَ للإسفنجِ رؤوسٌ أو أذرعٌ أو أعضاءٌ داخليّةٌ، ويعيشُ ملتصقًا بالصخورِ والنباتاتِ، والإسفنجُ مكتملُ النموِّ لا يتحرّكُ من مكانٍ لآخرَ؛ لذا فهو يشبهُ النباتاتِ، ويصنّفُه العلماءُ اليومَ من الحيواناتِ، فهو يأكلُ غذاءً لا يصنعُه بنفسِه كما تفعلُ النباتاتُ.<br>يوجدُ من الإسفنجِ ما يقربُ من (5,000) نوعٍ يعيشُ معظمُها في المحيطاتِ، إلّا أنَّ القليلَ منها يعيشُ في البحيراتِ والأنهارِ، كما أنَّ بإمكانِه العيشَ في المياهِ العميقةِ والضحلةِ على السواءِ.<br>يُعدُّ الإسفنجُ واحدًا من أقدمِ أنواعِ الحيواناتِ، إذ وُجدَتْ أحافيرُ لإسفنجٍ بحريٍّ كانَ يعيشُ قبلَ (500) مليونِ عامٍ. وتُعدُّ هياكلُ بعضِ أنواعِ الإسفنجِ أدواتٍ جيّدةً للتنظيفِ؛ نظرًا لكونِها ناعمةً وتمتصُّ قدرًا كبيرًا من الماءِ. ويصطادُ أصحابُ الصيدِ التجاريِّ الإسفنجَ من البحرِ الكاريبيِّ والبحرِ الأبيضِ المتوسّطِ، إلّا أنَّ معظمَ الإسفنجِ المستخدمِ في النظافةِ يُنتجُ صناعيًّا.</div><p class="small" style="color:var(--mut)">النص مختصر قليلًا من الكتاب.</p>`}],

<p>اصْطَحَبَ الْوالِدُ ابْنَهُ فَوّازًا؛ لِزِيارَةِ جارِهِمْ في الْمُسْتَشْفى، وَعِنْدَ <span class="gl" data-m="دخولهما">وُلوجِهِما</span> الْمُسْتَشْفى رَأى فَوّازٌ لَوْحَةً تُشيرُ إِلى مَنْعِ اسْتِخْدامِ الْهاتِفِ الْمَحْمولِ، مَكْتوبًا عَلَيْها: (يُمْنَعُ اسْتِخْدامُ الْهاتِفِ الْمَحْمولِ).</p>

<p>الْوالِدُ وَهُوَ يُغْلِقُ جِهازَهُ: الْهاتِفُ الْمَحْمولُ قَدْ يُؤَثِّرُ عَلى بَعْضِ الْأَجْهِزَةِ الطِّبِّيَّةِ في الْمُسْتَشْفى يا بُنَيَّ.</p>
<p>فَوّازٌ: حَقًّا يا أَبي؟!</p>
<p>الْوالِدُ: لَيْسَ هذا <span class="gl" data-m="فقط">فَحَسْبُ</span> يا بُنَيَّ، فَهُناكَ أَماكِنُ <span class="gl" data-m="يُمنع">يُحْظَرُ</span> فيها اسْتِخْدامُ الْهاتِفِ الْمَحْمولِ.</p>
<p>فَوّازٌ: مِثْلُ ماذا يا أَبي؟</p>
<p>الْوالِدُ: مِثْلُ الطّائِراتِ، فَإِنَّ عَلَيْنا أَنْ نُغْلِقَ الْهَواتِفَ الْمَحْمولَةَ عِنْدَ صُعودِنا إِلَيْها. وَأَهَمُّ هذِهِ الْأَماكِنِ الْمَساجِدُ (بُيوتُ اللهِ)، فَرَنينُ الْهاتِفِ الْمَحْمولِ يُزْعِجُ الْمُصَلّينَ وَيَقْطَعُ خُشوعَهُمْ.</p>
<p>إِنَّ الْهاتِفَ الْمَحْمولَ يا بُنَيَّ نِعْمَةٌ مِنَ اللهِ -عَزَّ وَجَلَّ- <span class="gl" data-m="أنعم">مَنَّ</span> بِها عَلَيْنا، وَبَعْضُنا يُسيءُ اسْتِخْدامَهُ، غَيْرَ مُقَدِّرٍ لِهذِهِ النِّعْمَةِ.</p>`}
],

<p>اجْتَمَعَتِ الْأُسْرَةُ؛ لِتُشاهِدَ <span class="gl" data-m="عرضًا">بَثًّا</span> مُباشِرًا لِيَوْمِ عَرَفَةَ، فَسَأَلَتْ دانِيَةُ والِدَها قائِلَةً: يا أَبي، كَيْفَ تُنْقَلُ صُوَرُ التِّلْفازِ مِنْ مَكانٍ إِلى آخَرَ؟</p>
<p>الْوالِدُ: تُنْقَلُ عَنْ طَريقِ الْأَقْمارِ الصِّناعِيَّةِ، يا بُنَيَّتي.</p>
<p>دانِيَةُ: وَما الْأَقْمارُ الصِّناعِيَّةُ؟</p>
<p>الْوالِدُ: الْأَقْمارُ الصِّناعِيَّةُ هِيَ أَجْسامٌ تَدورُ في <span class="gl" data-m="الفراغ الواسع المحيط بالأرض">الْفَضاءِ</span> الْخارِجِيِّ حَوْلَ الْأَرْضِ، وَقَدْ صَنَعَها الْإِنْسانُ؛ لِأَداءِ <span class="gl" data-m="أعمال">مُهِمّاتٍ</span> كَثيرَةٍ.</p>
<p>دانِيَةُ: وَما هذِهِ الْمُهِمّاتُ يا أَبي؟</p>
<p>الْوالِدُ: هُناكَ كَثيرٌ مِنَ الْمُهِمّاتِ لِهذِهِ الْأَقْمارِ يا بُنَيَّتي؛ فَبَعْضُها يُسْتَخْدَمُ لِمَعْرِفَةِ حالَةِ <span class="gl" data-m="حالة الجو">الطَّقْسِ</span>، وَبَعْضُها يُسْتَخْدَمُ لِلِاتِّصالاتِ كَالْهَواتِفِ الْمَحْمولَةِ، وَبَعْضُها يُسْتَخْدَمُ لِنَقْلِ الْبَثِّ التِّلْفازِيِّ الْمُباشِرِ.</p>
<p>دانِيَةُ: وَلِماذا سُمِّيَتْ بِالْأَقْمارِ يا أَبي؟</p>
<p>الْوالِدُ: سُمِّيَتْ بِالْأَقْمارِ؛ لِأَنَّها تُشْبِهُ الْقَمَرَ في دَوَرانِهِ حَوْلَ الْأَرْضِ.</p>
<p>دانِيَةُ: شُكْرًا يا أَبي، فَقَدْ تَعَلَّمْتُ الْيَوْمَ شَيْئًا جَديدًا، وَسَأَبْحَثُ في مَكْتَبَةِ الْمَدْرَسَةِ عَنْ مَزيدٍ مِنَ الْمَعْلوماتِ حَوْلَ الْأَقْمارِ الصِّناعِيَّةِ.</p>

learn:[{h:"نص نموذج الاختبار (4) من الكتاب", b:`<div class="ex" style="font-size:17px">يُحكى أنّه وُجدَ في الغابةِ شجرةُ موزٍ كبيرةُ الحجمِ، وكانَ بالقربِ منها بحيرةٌ تذهبُ إليها جميعُ الحيواناتِ وهي سعيدةٌ ومجتمعةٌ، وكانتِ الشجرةُ تنظرُ إليهم وتتحسّرُ على وحدتِها، وفي أحدِ الأيامِ اقتربَ طفلٌ اسمُه أيمنُ من البحيرةِ؛ ليلعبَ بمائِها، وأحسَّ بالتعبِ، فاقتربَ من شجرةِ الموزِ؛ ليستظلَّ بظلِّها، فشعرتْ بالفرحِ وقالتْ: أهلًا بكَ يا صغيري، فقد آنستَ وحدتي، وسنكونُ صديقينِ على الدوامِ. فأهدتْه من ثمارِها.<br>كبرَ أيمنُ ولم يعدْ يأتي، وفي أحدِ الأيامِ اقتربَ شابٌّ وإذا به أيمنُ، فصرختْ: لقد اشتقتُ لكَ كثيرًا! تحدّثَ معها عن الفقرِ الذي يعانيه، فاقترحتْ عليه أنْ يأخذَ من ثمارِها ليبيعَها، حتى أصبحَ بائعًا للموزِ.<br>غابَ أيمنُ مدّةً طويلةً ثمَّ رجعَ مهمومًا، وقالَ: أريدُ أنْ أتزوّجَ؛ ولكنّي لا أملكُ ثمنَ البيتِ، قالتْ له: خذْ من جذعي فروعًا؛ لتبنيَ بيتَكَ، ولكنْ أرجوكَ لا تتركْني وحيدةً. فوعدَها بزيارتِها، وبنى بفروعِها البيتَ.<br>ومرّتِ السنواتُ، وأصبحَ أيمنُ شيخًا كبيرًا، فتذكّرَ الشجرةَ، فقالتْ له: إنّي لا أملكُ فاكهةً ولا أملكُ الجذوعَ لأهديَكَ إيّاها. هنا شعرَ أيمنُ بالحزنِ على تلكَ الأيامِ التي تركَ فيها الشجرةَ وحيدةً، واعتذرَ قائلًا: سامحيني يا أمّي الشجرةَ؛ فقد كنتُ أنانيًّا.</div><p class="small" style="color:var(--mut)">النص مختصر قليلًا من الكتاب.</p>`}],

{id:"t-story", kind:"read", sect:"الدرس الأول: التعاون", title:"قصة التعاون", pages:"ص 102، 103",
learn:[
 {h:"اقرئي القصة بصوت عالٍ", story:true, b:`
<p>فِي يَوْمِ الْبِيئَةِ الْعَالَمِيِّ، طَلَبَ الْمُعَلِّمُ مِنْ تَلَامِيذِهِ الْمُشَارَكَةَ <span class="gl" data-m="آراء">بِاقْتِرَاحَاتٍ</span> يُحَافِظُونَ بِهَا عَلَى بِيئَةِ الْمَدْرَسَةِ.</p>
<p>أَخَذَ التَّلَامِيذُ يُفَكِّرُونَ، وَيَتَشَاوَرُونَ فِيمَا بَيْنَهُمْ، فَقَالَ فَوَّازٌ: فِي الْمَدْرَسَةِ سَاحَةٌ وَاسِعَةٌ، لِمَ لَا نَزْرَعُهَا لِتُصْبِحَ حَدِيقَةً؟</p>
<p>رَدَّ حَازِمٌ: السَّاحَةُ وَاسِعَةٌ، وَنَحْنُ صِغَارٌ، فَكَيْفَ يُمْكِنُنَا أَنْ نَزْرَعَهَا؟</p>
<p>أَجَابَ فَوَّازٌ: لَا <span class="gl" data-m="تَخافُ وتضطرب، وضدها: تطمئنّ">تَقْلَقْ</span> يَا حَازِمُ، فَبِالتَّعَاوُنِ نَجْتَازُ الصُّعُوبَاتِ، وَنُحَقِّقُ الْغَايَاتِ.</p>
<p>قَالَ الْمُعَلِّمُ: أَحْسَنْتَ يَا فَوَّازُ، فَالتَّعَاوُنُ خُلُقُ الْمُسْلِمِ، وَقَدْ أَمَرَنَا اللهُ تَعَالَى بِهِ فِي قَوْلِهِ تَعَالَى: <span class="ayah">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَى وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾</span>.</p>
<p>وَفِي الْيَوْمِ التَّالِي قَسَّمَ الْمُعَلِّمُ التَّلَامِيذَ مَجْمُوعَاتٍ، وَ<span class="gl" data-m="خصّ: أعطى شيئًا لواحد دون غيره، وضدها: عَمَّ">خَصَّ</span> كُلَّ مَجْمُوعَةٍ بِعَمَلٍ يَتَعَاوَنُ أَفْرَادُهَا عَلَى إِنْجَازِهِ؛ مَجْمُوعَةٌ تُنَظِّفُ السَّاحَةَ، وَثَانِيَةٌ تَحْفِرُ الْحُفَرَ، وَثَالِثَةٌ تَغْرِسُ <span class="gl" data-m="النباتات الصغيرة">الشَّتَلَاتِ</span>، وَرَابِعَةٌ تَسْقِيهَا بِالْمَاءِ.</p>
<p>أَحْضَرَ الْمُعَلِّمُ الشَّتَلَاتِ، وَوَفَّرَ لِلْمَجْمُوعَاتِ أَدَوَاتِ الزِّرَاعَةِ، فَأَخَذَتِ الْمَجْمُوعَاتُ تَعْمَلُ بِجِدٍّ وَنَشَاطٍ، وَمَا إِنْ <span class="gl" data-m="قارَبَ">شَارَفَ</span> الْيَوْمُ الدِّرَاسِيُّ عَلَى الِانْتِهَاءِ حَتَّى كَانَتِ السَّاحَةُ حَدِيقَةً خَضْرَاءَ.</p>
<p>دَهِشَ فَوَّازٌ مِنْ جَمَالِ الْحَدِيقَةِ، وَقَالَ: مَا أَجْمَلَ الْحَدِيقَةَ! اسْتَطَعْنَا أَنْ نُحَوِّلَ سَاحَةَ الْمَدْرَسَةِ إِلَى حَدِيقَةٍ <span class="gl" data-m="كثيرة الأشجار">غَنَّاءَ</span> فِي وَقْتٍ قَصِيرٍ، وَبِجُهْدٍ قَلِيلٍ.</p>
<p>قَالَ الْمُعَلِّمُ: إِنَّ التَّعَاوُنَ ثَمَرَةٌ مِنْ ثَمَرَاتِ الْإِيمَانِ، يَزِيدُ <span class="gl" data-m="التماسك">التَّرَابُطَ</span> فِي الْمُجْتَمَعِ، وَ<span class="gl" data-m="يَنشُر">يُشِيعُ</span> الْمَحَبَّةَ وَالْمَوَدَّةَ بَيْنَ النَّاسِ.</p>`}
],

{id:"i-story", kind:"read", sect:"الدرس الثاني: الإيثار", title:"قصة الإيثار", pages:"ص 115، 116",
learn:[
 {h:"اقرئي القصة بصوت عالٍ", story:true, b:`
<p>قَرَّرَ فَوَّازٌ شِرَاءَ كِتَابٍ مُفِيدٍ <span class="gl" data-m="مستفيدًا">مُسْتَثْمِرًا</span> نُقُودًا كَانَ قَدْ جَمَعَهَا فِي حَصَّالَتِهِ الصَّغِيرَةِ. طَلَبَ فَوَّازٌ مِنْ وَالِدِهِ أَنْ يَصْطَحِبَهُ إِلَى الْمَكْتَبَةِ؛ لِشِرَاءِ الْكِتَابِ، وَبَعْدَ فَرَاغِهِ مِنَ الْوَاجِبَاتِ الْمَنْزِلِيَّةِ ذَهَبَ مَعَ وَالِدِهِ إِلَى الْمَكْتَبَةِ، وَأَخَذَا يَتَجَوَّلَانِ فِيهَا وَيُطَالِعَانِ أَبْرَزَ عَنَاوِينِ مُحْتَوَيَاتِهَا مِنْ كُتُبٍ وَقِصَصٍ.</p>
<p>تَوَقَّفَ فَوَّازٌ عِنْدَ قِصَّةٍ عُنْوَانُهَا (<span class="gl" data-m="تفضيل الغير على النفس، وضده: الأنانية">الْإِيثَارُ</span>)، فَسَأَلَ وَالِدَهُ: مَا مَعْنَى الْإِيثَارِ يَا أَبِي؟ رَدَّ الْوَالِدُ: اشْتَرِ الْقِصَّةَ، وَاقْرَأْهَا؛ لِتَعْرِفَ مَعْنَى الْإِيثَارِ. اشْتَرَى فَوَّازٌ الْقِصَّةَ، وَعَادَ إِلَى الْبَيْتِ مُشْتَاقًا لِقِرَاءَتِهَا.</p>
<p>وَفِي الْقِصَّةِ قَرَأَ كَيْفَ آثَرَتْ أُمُّ الْمُؤْمِنِينَ عَائِشَةُ -رَضِيَ اللهُ عَنْهَا- الْمَرْأَةَ الْفَقِيرَةَ وَابْنَتَيْهَا عَلَى نَفْسِهَا، وَكَيْفَ آثَرَتِ الْأُمُّ ابْنَتَيْهَا عَلَى نَفْسِهَا.</p>
<p>وَفِي الْمَسَاءِ قَدِمَ الْوَالِدُ مِنْ عَمَلِهِ وَسَأَلَ فَوَّازًا: هَلْ قَرَأْتَ الْقِصَّةَ، وَعَرَفْتَ مَعْنَى الْإِيثَارِ؟</p>
<p>قَالَ فَوَّازٌ: نَعَمْ يَا أَبِي، وَالْقِصَّةُ هِيَ الَّتِي عَرَّفَتْنِي إِيَّاهُ: سَمِعَتْ أُمُّ الْمُؤْمِنِينَ عَائِشَةُ -رَضِيَ اللهُ عَنْهَا- طَرَقَاتٍ عَلَى الْبَابِ، فَلَمَّا نَظَرَتْ، وَجَدَتِ امْرَأَةً مِسْكِينَةً، وَمَعَهَا ابْنَتَاهَا الصَّغِيرَتَانِ، وَطَلَبَتِ الْمَرْأَةُ مِنْهَا طَعَامًا، وَلَمْ يَكُنْ فِي بَيْتِ أُمِّ الْمُؤْمِنِينَ عَائِشَةَ -رَضِيَ اللهُ عَنْهَا- فِي هَذَا الْيَوْمِ إِلَّا ثَلَاثُ تَمَرَاتٍ، فَأَحْضَرَتْهَا، وَأَعْطَتْهَا الْمَرْأَةَ.</p>
<p>أَخَذَتِ الْمَرْأَةُ التَّمَرَاتِ، وَأَعْطَتْ كُلَّ بِنْتٍ تَمْرَةً، وَأَخَذَتْ هِيَ التَّمْرَةَ الثَّالِثَةَ. فَأَكَلَتِ الْبِنْتَانِ التَّمْرَتَيْنِ، ثُمَّ نَظَرَتَا إِلَى التَّمْرَةِ الَّتِي فِي يَدِ أُمِّهِمَا، فَلَمْ تَتَرَدَّدِ الْأُمُّ، وَشَقَّتِ التَّمْرَةَ نِصْفَيْنِ، وَأَعْطَتْ كُلَّ بِنْتٍ مِنْهُمَا نِصْفًا، وَآثَرَتِ الْأُمُّ أَنْ تُطْعِمَ ابْنَتَيْهَا وَتَبْقَى جَائِعَةً.</p>
<p>أُعْجِبَتْ أُمُّ الْمُؤْمِنِينَ عَائِشَةُ -رَضِيَ اللهُ عَنْهَا- بِمَا فَعَلَتْهُ هَذِهِ الْمَرْأَةُ، وَلَمَّا جَاءَ رَسُولُ اللهِ ﷺ حَكَتْ ذَلِكَ الْمَوْقِفَ الَّذِي يَدُلُّ عَلَى إِيثَارِ الْأُمِّ، فَقَالَ لَهَا الرَّسُولُ ﷺ: «إِنَّ اللهَ قَدْ أَوْجَبَ لَهَا الْجَنَّةَ».</p>
<p>الْوَالِدُ: مَا أَجْمَلَ الْإِيثَارَ يَا بُنَيَّ! فَالْمُسْلِمُ الْحَقُّ <span class="gl" data-m="يُفضِّل غيره على نفسه">يُؤْثِرُ</span> غَيْرَهُ عَلَى نَفْسِهِ، فَيَجُوعُ؛ لِيَشْبَعَ أَخُوهُ، وَ<span class="gl" data-m="يعطش، وضدها: يرتوي">يَظْمَأُ</span>؛ لِيَرْتَوِيَ أَخُوهُ. قَالَ تَعَالَى: <span class="ayah">﴿وَيُؤْثِرُونَ عَلَى أَنْفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ وَمَنْ يُوقَ شُحَّ نَفْسِهِ فَأُولَئِكَ هُمُ الْمُفْلِحُونَ﴾</span>.</p>`}
],

const RANKS=[[0,"بذرة صغيرة"],[200,"شتلة نشيطة"],[600,"زهرة متفتحة"],[1200,"شجرة مثمرة"],[2000,"حديقة غنّاء"],[3000,"نجمة لغتي"],[4200,"بطلة لغتي"]];

function home(){
  L=UNITS[S.u-1].L;
  const {r,nx}=rank(); const pct=nx?Math.round((S.xp-r[0])/(nx[0]-r[0])*100):100;
  const U=UNITS[S.u-1];
  let h=`<div class="top"><a class="chip" href="../index.html" style="text-decoration:none;color:inherit">⌂ الرئيسية</a><div class="chip" title="أيام متتالية">${FLAME}<span>${streak()}</span></div><div class="chip" title="النقاط">${GEM}<span>${S.xp}</span></div></div>
  <div class="hero"><h1>رحلة لغتي</h1><p>الصف الثالث · الفصل الأول</p>
  <div class="lvl"><div class="bar"><i style="width:${pct}%"></i></div><small><span>${r[1]}</span><span>${nx?`${nx[0]-S.xp} نقطة إلى: ${nx[1]}`:"وصلتِ للقمة!"}</span></small></div></div>
  <div class="units">${UNITS.map((u,k)=>{const got=u.L.reduce((a,l)=>a+(S.done[l.id]||0),0),all=u.L.length*3;return `<button class="ucard ${S.u===k+1?'on':''}" data-u="${k+1}"><span class="n" style="background:${u.c}">${k+1}</span><b>${u.name}</b><small>${u.pages} · ${got}/${all} نجمة</small><div class="ub"><i style="width:${Math.round(got/all*100)}%;background:${u.c}"></i></div></button>`}).join("")}</div>
  <div class="path"><div class="sect" style="color:${U.c}">الوحدة ${S.u}: ${U.name}</div>`;
  let sec="";
  L.forEach((l,i)=>{
    if(l.sect!==sec){sec=l.sect;h+=`<div class="sect" style="font-size:17px">${sec}</div>`}
    const st=S.done[l.id]||0;
    h+=`<button class="node ${l.kind} ${st?'done':''}" data-i="${i}"><span class="ic">${i+1}</span><span class="tx"><b>${l.title}</b><span>${l.pages} · ${l.ex.length} أسئلة</span></span><span class="stars">${STAR(st>=1)}${STAR(st>=2)}${STAR(st>=3)}</span></button>`;
  });
  h+=`</div><div class="parent"><b>للأم:</b> النصوص والقواعد والإملاء منقولة من كتاب الطالب (لغتي، الصف الثالث، الفصل الأول، طبعة 1448هـ). نصوص "التحدي الكبير" في الوحدات 1 و2 و4 هي نماذج الاختبار من الكتاب نفسه، ونص تحدي الوحدة 3 من تأليفنا للتدريب على نمط الأسئلة المركزية. الأسئلة البنفسجية (فكّري) أسئلة مهارات تفكير عليا. نصوص الاستماع غير موجودة في كتاب الطالب، فأخذنا منها ما في الكتاب فقط. أسئلة (اكتبي) إجابتها النموذجية للاسترشاد، وأي إجابة صحيحة بمعناها مقبولة. التقدم يُحفظ على هذا الجهاز فقط بدون تسجيل، ولا يُرسل لأي مكان، وكل جهاز له نقاطه الخاصة.</div><div id="rst" style="margin-top:16px"><button class="btn ghost" id="rs1">مسح تقدمي والبدء من جديد</button></div><p class="credit">تصميم وتطوير: نورة الدوسري</p>`;
  app.innerHTML=h;
  document.getElementById("rs1").onclick=()=>{document.getElementById("rst").innerHTML=`<div class="fb no"><b>متأكدة؟</b>ستُحذف كل النقاط والنجوم والأيام من هذا الجهاز فقط.</div><div class="row"><button class="btn bad" id="rsy">نعم، امسحي</button><button class="btn ghost" id="rsn">تراجعي</button></div>`;document.getElementById("rsn").onclick=home;document.getElementById("rsy").onclick=()=>{S={xp:0,done:{},days:[],best:0,u:1};save();home()}};
  app.querySelectorAll(".ucard").forEach(b=>b.onclick=()=>{S.u=+b.dataset.u;save();home()});
  app.querySelectorAll(".node").forEach(b=>b.onclick=()=>start(+b.dataset.i));
  window.scrollTo(0,0);
}

/* ============ LESSON ENGINE ============ */
let R;
function start(i){
  const l=L[i];
  R={l,i,steps:[...l.learn.map(c=>({t:"learn",c})),...l.ex.map(e=>({t:"ex",e}))],k:0,mist:0,first:0,total:l.ex.length,combo:0,xp:0,retried:new Set()};
  step();
}
function bar(){
  const done=R.k/R.steps.length*100;
  return `<div class="lhead"><button class="x" aria-label="خروج" id="xbtn">✕</button><div class="prog"><i style="width:${done}%"></i></div><div class="combo">${R.combo>=3?FLAME.replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')+R.combo:""}</div></div>`;
}
function step(){
  if(R.k>=R.steps.length) return finish();
  const s=R.steps[R.k];
  if(s.t==="learn") return learnCard(s.c);
  const e=s.e;
  ({mcq,tf,match,sort,order,dict,write})[e.t](e);
}
function wireX(){document.getElementById("xbtn").onclick=home}
function learnCard(c){
  app.innerHTML=bar()+`<div class="card learn"><span class="tag">تعلّمي · ${R.l.pages}</span><h2>${c.h}</h2><div class="${c.story?'story':''}">${c.b}</div>${c.story?'<p class="tip" style="font-family:var(--f-ui);font-size:15px">اضغطي على الكلمة الملوّنة لتعرفي معناها.</p><div class="meaning" id="mean" hidden></div>':''}</div><div class="foot"><button class="btn" id="nx">فهمت، التالي</button></div>`;
  wireX();
  app.querySelectorAll(".gl").forEach(g=>g.onclick=()=>{const m=document.getElementById("mean");m.hidden=false;m.innerHTML=`<b>${g.textContent}</b>: ${g.dataset.m}`});
  document.getElementById("nx").onclick=()=>{R.k++;step()};
  window.scrollTo(0,0);
}
function head(e){
  const pas=e.p&&R.l.passage?`<details style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:800;color:var(--tealD)">اعرضي النص</summary><div class="ex">${R.l.passage}</div></details>`:"";
  return bar()+`<div class="card">${pas}<span class="tag ${e.hots?'hots':''}">${e.hots?'فكّري: مهارة تفكير عليا':label(e.t)}</span><h3 class="q">${e.q||''}</h3><div id="body"></div></div><div class="foot" id="foot"><button class="btn" id="chk" disabled>تحقّقي</button></div>`;
}
function label(t){return {mcq:"اختاري الإجابة الصحيحة",tf:"صح أم خطأ؟",match:"لعبة التوصيل",sort:"لعبة التصنيف",order:"رتّبي الكلمات",dict:"تدريب الإملاء"}[t]}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PRAISE=["أحسنتِ يا بطلة!","رائعة!","ممتاز، استمري!","إجابة ذكية!","ما شاء الله عليكِ!","صحيح، أنتِ نجمة!"];
const CHEER=["لا بأس، سنعيده لكِ في آخر الدرس.","قريبة! اقرئي التوضيح وجرّبي لاحقًا.","الخطأ يعلّمنا، تابعي!"];
function verdict(ok,e,correctText){
  const f=document.getElementById("foot");
  const isRetry=R.retried.has(R.steps[R.k]);
  if(ok){R.combo++;const add=isRetry?5:10+(R.combo>=3?5:0);R.xp+=add;if(!isRetry)R.first++;tone(true)}
  else{R.combo=0;R.mist++;tone(false);if(!isRetry){const cp=R.steps[R.k];R.retried.add(cp);R.steps.push(cp)}}
  f.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]+(R.combo>=3?` (${R.combo} متتالية!)`:''):'الإجابة الصحيحة:'}</b>${ok?'':esc(correctText||'')}${e.why?`<div>${e.why}</div>`:''}${ok?'':`<div style="font-size:15px;margin-top:4px">${CHEER[Math.floor(Math.random()*CHEER.length)]}</div>`}</div><button class="btn ${ok?'go':'bad'}" id="nx">متابعة</button>`;
  document.getElementById("nx").onclick=()=>{R.k++;step()};
  document.getElementById("nx").focus();
}
function mcq(e){
  app.innerHTML=head(e); wireX();
  const b=document.getElementById("body"); const ord=e.o.map((t,i)=>({t,i}));
  const list=e.o.length>2&&!/^(اختاري|أكملي|ما|العلامة)/.test(e.q)?shuffle(ord):ord;
  b.innerHTML=`<div class="opts">${list.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("")}</div>`;
  let sel=null; const chk=document.getElementById("chk");
  b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{b.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");sel=+o.dataset.i;chk.disabled=false});
  chk.onclick=()=>{const ok=sel===e.a;b.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===e.a)o.classList.add("ok");else if(+o.dataset.i===sel)o.classList.add("no")});verdict(ok,e,e.o[e.a])};
}
function tf(e){
  app.innerHTML=head(e); wireX();
  const b=document.getElementById("body");
  b.innerHTML=`<div class="opts tf"><button class="opt" data-v="1">✓ صح</button><button class="opt" data-v="0">✗ خطأ</button></div>`;
  let sel=null; const chk=document.getElementById("chk");
  b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{b.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");sel=o.dataset.v==="1";chk.disabled=false});
  chk.onclick=()=>{const ok=sel===e.a;b.querySelectorAll(".opt").forEach(o=>{o.disabled=true;const v=o.dataset.v==="1";if(v===e.a)o.classList.add("ok");else if(v===sel)o.classList.add("no")});verdict(ok,e,e.a?"صح":"خطأ")};
}
function match(e){
  app.innerHTML=head(e); wireX();
  const b=document.getElementById("body"); document.getElementById("foot").innerHTML="";
  const A=shuffle(e.pairs.map((p,i)=>({t:p[0],i}))),B=shuffle(e.pairs.map((p,i)=>({t:p[1],i})));
  b.innerHTML=`<div class="cols"><div>${A.map(x=>`<button class="tile" data-s="a" data-i="${x.i}">${x.t}</button>`).join("")}</div><div>${B.map(x=>`<button class="tile" data-s="b" data-i="${x.i}">${x.t}</button>`).join("")}</div></div>`;
  let pick=null,left=e.pairs.length,miss=0;
  b.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    if(!pick||pick.dataset.s===t.dataset.s){b.querySelectorAll(".tile.sel").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");pick=t;return}
    if(pick.dataset.i===t.dataset.i){[pick,t].forEach(x=>{x.classList.remove("sel");x.classList.add("gone")});tone(true,.5);left--;pick=null;if(!left)verdict(miss<2,e,"")}
    else{miss++;tone(false,.5);[pick,t].forEach(x=>{x.classList.add("shake");setTimeout(()=>x.classList.remove("shake","sel"),350)});pick=null}
  });
}
function sort(e){
  app.innerHTML=head(e); wireX();
  const b=document.getElementById("body"); document.getElementById("foot").innerHTML="";
  const items=shuffle(e.items.map((x,i)=>({w:x[0],c:x[1],i})));
  b.innerHTML=`<p style="margin:0 0 8px;color:var(--mut)">اضغطي الكلمة، ثم اضغطي الصندوق المناسب.</p><div class="pool">${items.map(x=>`<button class="tile" data-i="${x.i}">${x.w}</button>`).join("")}</div><div class="bins">${e.bins.map((n,k)=>`<div class="bin" data-k="${k}" role="button" tabindex="0"><h4>${n}</h4><div class="in"></div></div>`).join("")}</div>`;
  let pick=null,left=items.length,miss=0;
  b.querySelectorAll(".pool .tile").forEach(t=>t.onclick=()=>{b.querySelectorAll(".pool .tile").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");pick=t});
  b.querySelectorAll(".bin").forEach(bin=>bin.onclick=()=>{
    if(!pick)return; const it=e.items[+pick.dataset.i];
    if(it[1]===+bin.dataset.k){bin.querySelector(".in").insertAdjacentHTML("beforeend",`<span>${it[0]}</span>`);pick.classList.add("gone");pick.classList.remove("sel");tone(true,.5);left--;pick=null;if(!left)verdict(miss<2,e,"")}
    else{miss++;tone(false,.5);pick.classList.add("shake");const p=pick;setTimeout(()=>p.classList.remove("shake"),350)}
  });
}
function order(e){
  app.innerHTML=head(e); wireX();
  const b=document.getElementById("body"); const chk=document.getElementById("chk");
  const pool=shuffle(e.words.map((w,i)=>({w,i}))); let ans=[];
  b.innerHTML=`<div class="line" id="ln"></div><div class="pool" id="pl"></div>`;
  const draw=()=>{
    document.getElementById("ln").innerHTML=ans.map((x,k)=>`<button class="tile" data-k="${k}">${x.w}</button>`).join("");
    document.getElementById("pl").innerHTML=pool.map(x=>`<button class="tile ${ans.includes(x)?'gone':''}" data-i="${x.i}">${x.w}</button>`).join("");
    b.querySelectorAll("#pl .tile").forEach(t=>t.onclick=()=>{ans.push(pool.find(x=>x.i===+t.dataset.i));draw()});
    b.querySelectorAll("#ln .tile").forEach(t=>t.onclick=()=>{ans.splice(+t.dataset.k,1);draw()});
    chk.disabled=ans.length!==e.words.length;
  };draw();
  chk.onclick=()=>{const ok=ans.every((x,k)=>x.w===e.words[k]);b.querySelectorAll(".tile").forEach(t=>t.disabled=true);verdict(ok,e,e.words.join(" ← "))};
}
function write(e){
  app.innerHTML=bar()+`<div class="card"><span class="tag" style="background:#FFF1C9;color:#7a5600">اكتبي: في دفترك أو هنا</span><h3 class="q">${e.q}</h3>${e.hint?`<p class="tip" style="font-size:15px">${e.hint}</p>`:''}<textarea id="ta" rows="3" style="width:100%;font-family:var(--f-read);font-size:19px;border:2px solid var(--line);border-radius:14px;padding:10px;background:#FFFDF8;color:var(--ink)" placeholder="اكتبي إجابتك..."></textarea><div id="mdl"></div></div><div class="foot" id="foot"><button class="btn" id="shw">انتهيت، أظهري الإجابة النموذجية</button></div>`;
  wireX();
  document.getElementById("shw").onclick=()=>{
    document.getElementById("mdl").innerHTML=`<div class="fb ok" style="margin-top:10px"><b>الإجابة النموذجية</b>${e.model}</div>`;
    document.getElementById("foot").innerHTML=`<p style="margin:0 0 8px;font-weight:800">قارني إجابتكِ (ماما تساعدك):</p><div class="row"><button class="btn go" id="g">إجابتي صحيحة</button><button class="btn bad" id="w">أحتاج تعديل</button></div>`;
    document.getElementById("g").onclick=()=>verdict(true,{},"");
    document.getElementById("w").onclick=()=>{R.combo=0;R.xp+=5;document.getElementById("foot").innerHTML=`<div class="fb no"><b>ممتاز أنكِ حاولتِ!</b>صحّحي إجابتك في الدفتر من الإجابة النموذجية. (+5 نقاط)</div><button class="btn" id="nx">متابعة</button>`;document.getElementById("nx").onclick=()=>{R.k++;step()}};
  };
}
function dict(e){
  app.innerHTML=bar()+`<div class="card"><span class="mk ${e.kind.includes('منظور')?'p':''}">${e.kind}</span><h3 class="q" style="font-size:19px">${e.kind.includes('منظور')?'اقرئي القطعة مرتين، ثم اضغطي (أخفي) وتمليها عليكِ ماما.':'انقلي القطعة في دفترك وأنتِ تنظرين إليها.'}</h3><div class="dictbox" id="db">${e.text}</div></div>
  <div class="foot" id="foot"><div class="row" id="r1"><button class="btn ghost" id="hide">${e.kind.includes('منظور')?'أخفي القطعة':'انتهيتُ من النقل'}</button></div></div>`;
  wireX();
  document.getElementById("hide").onclick=()=>{
    document.getElementById("db").classList.add("hide");
    document.getElementById("foot").innerHTML=`<button class="btn ghost" id="show" style="margin-bottom:12px">أظهري القطعة للتصحيح</button>`;
    document.getElementById("show").onclick=()=>{
      document.getElementById("db").classList.remove("hide");
      document.getElementById("foot").innerHTML=`<p style="margin:0 0 8px;font-weight:800">قارني كتابتك بالقطعة. كيف كانت؟</p><div class="row"><button class="btn go" id="g">كتبتها صحيحة</button><button class="btn bad" id="w">أخطأت في كلمات</button></div>`;
      document.getElementById("g").onclick=()=>verdict(true,{why:"أحسنتِ! إملاء جميل."},"");
      document.getElementById("w").onclick=()=>{R.combo=0;R.xp+=5;document.getElementById("foot").innerHTML=`<div class="fb no"><b>لا بأس!</b>اكتبي كل كلمة أخطأتِ فيها 3 مرات، وستكون الإجابة أسهل في المرة القادمة. (+5 نقاط لأنك حاولتِ)</div><button class="btn" id="nx">متابعة</button>`;document.getElementById("nx").onclick=()=>{R.k++;step()}};
    };
  };
}
function finish(){
  const acc=R.total?R.first/R.total:1;
  const stars=acc>=.9?3:acc>=.7?2:1;
  const bonus=stars*10; R.xp+=bonus;
  S.xp+=R.xp; S.done[R.l.id]=Math.max(S.done[R.l.id]||0,stars);
  if(!S.days.includes(today()))S.days.push(today()); save();
  const next=L[R.i+1];
  app.innerHTML=`<div class="res">${MASCOT(stars>=2?'happy':'sad')}<h2>${stars===3?'مذهلة!':stars===2?'أحسنتِ!':'أكملتِ الدرس!'}</h2><p style="font-size:18px;margin:0">${R.l.title}</p>
  <div class="bigstars">${STAR(stars>=1)}${STAR(stars>=2)}${STAR(stars>=3)}</div>
  <div class="stats"><div class="stat"><b>+${R.xp}</b>نقطة</div><div class="stat"><b>${Math.round(acc*100)}%</b>صحيحة من أول مرة</div></div>
  ${stars<3?'<p style="color:var(--mut)">أعيدي الدرس لتجمعي 3 نجوم!</p>':''}
  <div style="display:grid;gap:12px;margin-top:14px">${next?`<button class="btn go" id="nxt">الدرس التالي: ${next.title}</button>`:''}<button class="btn ghost" id="again">أعيدي الدرس</button><button class="btn ghost" id="hm">طريق الوحدة</button></div></div>`;
  if(stars>=2)confetti();
  if(next)document.getElementById("nxt").onclick=()=>start(R.i+1);
  document.getElementById("again").onclick=()=>start(R.i);
  document.getElementById("hm").onclick=home;
  window.scrollTo(0,0);
}

/* ============ SOUND + CONFETTI ============ */
let AC=null;
function tone(ok,vol=1){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880]:[300,220]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.15*vol,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.18);o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.2)})}catch(e){}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#F26A2E","#25A8AE","#1767B0","#F5B700","#2BA84A","#F2C4B3"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
home();
</script>



<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}))}
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;showInstall()});
function showInstall(){
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;
  if(document.getElementById("inst"))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!deferred&&!ios)return;
  const b=document.createElement("div");b.id="inst";
  b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;background:#24343A;color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;font-family:Tajawal,system-ui,sans-serif;font-size:15px;direction:rtl";
  b.innerHTML=ios?'<span style="flex:1">ثبّتي التطبيق: اضغطي زر المشاركة <b>⎋</b> ثم <b>إضافة إلى الشاشة الرئيسية</b></span><button id="ix" style="background:none;border:0;color:#fff;font-size:22px">✕</button>':'<span style="flex:1">ثبّتي "رحلة لغتي" على جوالك مثل التطبيق</span><button id="ib" style="background:#F26A2E;color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:800;font-family:inherit">تثبيت</button><button id="ix" style="background:none;border:0;color:#fff;font-size:22px">✕</button>';
  document.body.appendChild(b);
  document.getElementById("ix").onclick=()=>b.remove();
  const ib=document.getElementById("ib");if(ib)ib.onclick=async()=>{b.remove();deferred.prompt();deferred=null};
}
addEventListener("load",()=>setTimeout(showInstall,1500));
</script>
